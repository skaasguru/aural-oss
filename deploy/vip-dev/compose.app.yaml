services:
  web:
    image: ${AURAL_WEB_IMAGE:?set immutable amd64 web image}
    restart: unless-stopped
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      # Supabase SSR derives its auth-cookie namespace from this hostname.
      # Keep it identical to the browser URL unless storageKey is explicitly shared in code.
      SUPABASE_URL: ${PUBLIC_SUPABASE_URL:?required}
      SUPABASE_ANON_KEY: ${ANON_KEY:?required}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?required}
      NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:?required}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?required}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:?required}
      NEXT_PUBLIC_VOICE_RELAY_URL: wss://aural.dev.skaaslabs.com/ws/voice
      NEXT_PUBLIC_VOICE_RELAY_PRIMARY: voice
      # BIFROST_API_KEY is this app's Bifrost virtual key (`aural-dev`): every model, speech and
      # relay call is attributed to it in the gateway logs. No provider key ever reaches Aural.
      OPENAI_API_KEY: ${BIFROST_API_KEY:?required}
      OPENAI_BASE_URL: http://vip-bifrost:8080/v1
      # Claude through Bifrost's `anthropic` provider: Haiku for interactive turns, Sonnet for reports.
      LLM_CHAT_MODEL: ${AURAL_LLM_FAST_MODEL:-anthropic/claude-haiku-5-5}
      LLM_GENERATOR_MODEL: ${AURAL_LLM_FAST_MODEL:-anthropic/claude-haiku-5-5}
      LLM_REPORT_MODEL: ${AURAL_LLM_REPORT_MODEL:-anthropic/claude-sonnet-5-5}
      # AssemblyAI TTS through Bifrost's `assemblyai` provider (OpenAI speech API, raw 24 kHz PCM).
      VOICE_TTS_PROVIDER: openai-compatible
      VOICE_TTS_BASE_URL: ${AURAL_TTS_BASE_URL:-http://vip-bifrost:8080/v1}
      VOICE_TTS_API_KEY: ${AURAL_TTS_API_KEY:-${BIFROST_API_KEY}}
      VOICE_TTS_MODEL: ${AURAL_TTS_MODEL:-assemblyai/assemblyai-tts-en}
      VOICE_TTS_VOICE: ${AURAL_TTS_VOICE:-aai-kyla}
      VOICE_TTS_FORMAT: ${AURAL_TTS_FORMAT:-pcm}
      VOICE_TTS_MAX_INPUT_CHARS: ${AURAL_TTS_MAX_INPUT_CHARS:-200}
      VOICE_TTS_TIMEOUT_MS: ${AURAL_TTS_TIMEOUT_MS:-30000}
      VOICE_TTS_MAX_SEGMENTS: "30"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      private: {}
      ingress:
        aliases: [aural-web]
  relay:
    image: ${AURAL_RELAY_IMAGE:?set immutable amd64 relay image}
    restart: unless-stopped
    mem_limit: 256m
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      VOICE_RELAY_PORT: "8766"
      VOICE_RELAY_HOST: 0.0.0.0
      # AssemblyAI Sync STT through the Bifrost relay `assemblyai-stt` (one request per utterance).
      VOICE_ASR_PROVIDER: ${AURAL_STT_PROVIDER:-assemblyai}
      VOICE_STT_BASE_URL: ${AURAL_STT_BASE_URL:-http://vip-bifrost:8080/relay/assemblyai-stt}
      VOICE_STT_API_KEY: ${BIFROST_API_KEY:?required}
      VOICE_STT_MODEL: ${AURAL_STT_MODEL:-universal-3-6-pro}
      VOICE_STT_LANGUAGE: en
      # AssemblyAI TTS through Bifrost's `assemblyai` provider (OpenAI speech API, raw 24 kHz PCM).
      VOICE_TTS_PROVIDER: openai-compatible
      VOICE_TTS_BASE_URL: ${AURAL_TTS_BASE_URL:-http://vip-bifrost:8080/v1}
      VOICE_TTS_API_KEY: ${AURAL_TTS_API_KEY:-${BIFROST_API_KEY}}
      VOICE_TTS_MODEL: ${AURAL_TTS_MODEL:-assemblyai/assemblyai-tts-en}
      VOICE_TTS_VOICE: ${AURAL_TTS_VOICE:-aai-kyla}
      VOICE_TTS_FORMAT: ${AURAL_TTS_FORMAT:-pcm}
      VOICE_TTS_MAX_INPUT_CHARS: ${AURAL_TTS_MAX_INPUT_CHARS:-200}
      VOICE_TTS_TIMEOUT_MS: ${AURAL_TTS_TIMEOUT_MS:-30000}
      VOICE_TTS_MAX_SEGMENTS: "30"
      RELAY_LLM_PROVIDER: openai
      RELAY_LLM_API_KEY: ${BIFROST_API_KEY:?required}
      RELAY_LLM_BASE_URL: http://vip-bifrost:8080/v1
      RELAY_LLM_MODEL: ${AURAL_LLM_FAST_MODEL:-anthropic/claude-haiku-5-5}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8766/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      private: {}
      ingress:
        aliases: [aural-relay]
